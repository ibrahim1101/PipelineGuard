name: Windows desktop release build

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing GitHub release tag to build"
        required: true
        type: string
  release:
    types: [published]

permissions:
  contents: write

jobs:
  desktop:
    runs-on: windows-latest
    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.event.release.tag_name || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Run tests
        run: python -m pytest -q

      - name: Build standalone desktop folder
        run: python -m PyInstaller --noconfirm --windowed --onedir --name PipelineGuard desktop_launcher.py

      - name: Verify executable exists
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/PipelineGuard/PipelineGuard.exe")) {
            throw "Desktop executable missing"
          }

      - name: Compile installer
        shell: pwsh
        run: |
          $compiler = "C:/Program Files (x86)/Inno Setup 6/ISCC.exe"
          if (-not (Test-Path $compiler)) {
            throw "Inno Setup 6 is required on the Windows runner"
          }
          & $compiler packaging/windows-installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Installer compilation failed" }

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PipelineGuard-Windows-${{ inputs.release_tag || github.event.release.tag_name || github.ref_name }}
          path: |
            dist/PipelineGuard/
            dist/installer/
          if-no-files-found: error

      - name: Attach installer to GitHub release
        if: (github.event_name == 'release' && github.event.action == 'published') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.event.release.tag_name }}
          files: |
            dist/installer/*
