name: Windows desktop development build
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Run tests
        run: python -m pytest -q
      - name: Build standalone desktop folder
        run: python -m PyInstaller --windowed --onedir --name PipelineGuard desktop_launcher.py
      - name: Verify executable exists
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/PipelineGuard/PipelineGuard.exe")) {
            throw "Desktop executable missing"
          }
      - name: Compile installer
        shell: pwsh
        run: |
          $compiler = "C:/Program Files (x86)/Inno Setup 6/ISCC.exe"
          if (-not (Test-Path $compiler)) {
            throw "Inno Setup 6 is required on the Windows runner"
          }
          & $compiler packaging/windows-installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Installer compilation failed" }
      - name: Upload development artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PipelineGuard-Windows-development
          path: |
            dist/PipelineGuard/
            dist/installer/
          if-no-files-found: error
