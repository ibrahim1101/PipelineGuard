name: PipelineGuard Security Scan

on:
  push:
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  security-scan:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run tests
        shell: bash
        run: python -m pytest -q

      - name: Build and smoke-test Docker image
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          docker build -t pipelineguard:ci .
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace:ro" \
            pipelineguard:ci scan /workspace --config /workspace/.pipelineguard.ci.json

      - name: Run PipelineGuard gate and generate SARIF
        id: gate
        shell: bash
        run: |
          set +e
          python -m pipelineguard.main scan . \
            --config .pipelineguard.ci.json \
            --output reports/pipelineguard.sarif \
            --github-annotations
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload SARIF to GitHub Code Scanning
        if: always() && hashFiles('reports/pipelineguard.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: reports/pipelineguard.sarif

      - name: Enforce PipelineGuard gate
        if: always() && steps.gate.outputs.exit_code != '0'
        shell: bash
        run: |
          echo "PipelineGuard blocked this workflow (exit code ${{ steps.gate.outputs.exit_code }})."
          exit 1
